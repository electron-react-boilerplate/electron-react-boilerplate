name: Test

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ${{ matrix.os }}

    strategy:
      matrix:
        os: [macos-latest, windows-latest, ubuntu-latest]

    steps:
      - name: Check out Git repository
        uses: actions/checkout@v7.0.1

      - name: Install Node.js and NPM
        uses: actions/setup-node@v7.0.0
        with:
          node-version: 24
          cache: npm

      - name: Clean install
        run: |
          npm ci

      - name: npm test
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          npm run package
          npm run lint
          npm run typecheck
          npm test

      - name: Verify Electron startup (Linux)
        if: runner.os == 'Linux'
        run: xvfb-run --auto-servernum npm run test:smoke

      - name: Verify Electron startup (macOS and Windows)
        if: runner.os != 'Linux'
        run: npm run test:smoke
